name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install fonts for the PDF watermark
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # упавшие тесты — аннотациями, чтобы их было видно без скачивания журнала
          grep -E "^(FAILED|ERROR) " pytest.log | sed 's/^/::error title=pytest::/'
          grep -E "^E  " pytest.log | head -20 | sed 's/^/::error title=detail::/'
          exit $status

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer script
        run: shellcheck -S warning deploy/install.sh
